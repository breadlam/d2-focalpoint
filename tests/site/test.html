<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site logic tests</title>
  <style>body { font: 14px/1.5 monospace; margin: 16px; } .fail { color: #b83a26; } .pass { color: #187a44; }</style>
</head>
<body>
  <h1>site/app.js logic tests</h1>
  <p>Serve the repository root (<code>python3 -m http.server</code>) and open
    <code>/tests/site/test.html</code>. The verdict is in <code>#verdict</code>.</p>
  <pre id="log"></pre>
  <p id="verdict">running…</p>
  <script type="module">
    import {
      DEFAULTS, NONE, addPart, decodeRecipe, facetOptions, formatHash, missingParts, parseHash, pct, pickLine, prepare, recipeDiff,
      recipeIncludes, results, rowRecipes, scopeLabel, topLine, findHash, bookHash, shortId, buildLink, viewOf,
    } from '../../site/app.js';
    import {
      HIGHLIGHT_DEFAULTS, bySubclass, formatHighlightHash, noveltyLine, parseHighlightHash, picksOf, rankedHash, startHighlights,
    } from '../../site/highlights.js';
    import {
      FIND_DEFAULTS, activityFacet, buildHash, formatFindHash, includeFacet, matchingBuilds, matchingTypes, parseFindHash,
      parseIndex, parseShard, shardsOf, typeFacet,
    } from '../../site/finder.js';

    const names = ['Dawnblade', 'Well of Radiance', 'Phoenix Dive', 'Burst Glide', 'Incinerator Snap',
      'Solar Grenade', 'Heat Rises', 'Icarus Dash', 'Ember of Char', 'The Mountaintop', 'Fatebringer',
      'Outlaw', 'Adaptive Frame', 'Hands-On', 'Firepower', 'Getaway Artist', 'Elemental Siphon',
      'Iron Will', 'Iron Set', 'Grenadier', 'Synthoceps', 'Whisper of Chains'];
    const kit = [0, 1, 2, 3, 4, 5, [6, 7], [8], []];
    // Positional recipes: [id, stats, kit, armor, weapons, [[set, pieces, [bonus]]], artifact item, artifact perks].
    const top = ['10', [30, 10, 20, 200, 100, 15], kit,
      [[3, 15, 1, 19, null, [], [13, 13], []]], [[1, 9, 0, 12, [11], null, null]], [[18, 2, [17]]], null, [16], 0];
    const variant = ['11', [30, 10, 20, 190, 100, 15], kit,
      [[3, 15, 1, 19, null, [], [13, 14], []]], [[1, 10, 0, null, [11], null, null]], [[18, 2, [17]]], null, [16], 0];
    const titan = ['20', null, [null, null, null, null, null, null, [], [21], []], [], [], [], null, [16], 1];
    // The book index (format 4) and its parts: rows are
    // [type, effect, raw, skill, players, runs, last, top pick, variant picks, more,
    //  loadout clears, loadout exact builds]; picks are [recipe, effect, runs, players, last].
    const allRows = [
      [0, 0.25, 0.8, 0.2, 9, 12, '2026-09-16', [0, 0.3, 4, 1, '2026-09-15'], [[1, 0.1, 1, 1, '2026-09-10']], 0, 5, 2],
      [1, 0.1, 0.3, 0.1, 800, 1000, '2026-09-16', [2, 0.5, 6, 3, '2026-09-16'], [], 0, 6, 1]];
    const ucRows = [
      [1, 0.13, 0.27, 0.1, 832, 1000, '2026-09-16', [0, 0.2, 3, 2, '2026-09-16'], [], 0, 3, 4]];
    const ucMore = [
      [0, -0.05, 0.1, 0.1, 2, 3, '2026-09-01', [0, 0.1, 1, 1, '2026-09-01'], [], 0, 1, 1]];
    const data = {
      format: 6, imported_at: '', first_run: '2026-06-09', last_run: '2026-09-16',
      icon_base: 'https://www.bungie.net', icons: {}, stats: [], elements: {},
      dict: names.map((n) => [n, null, null, null]),
      types: [
        { class: 'Warlock', element: 'Solar', armor: 'Getaway Artist', weapon: null, super: 'Well of Radiance', aspects: ['Heat Rises', 'Icarus Dash'] },
        { class: 'Titan', element: 'Stasis', armor: 'Synthoceps', weapon: 'Ice Breaker', super: 'Glacial Quake', aspects: ['Howl of the Storm'] },
      ],
      scopes: [
        { id: 'all', name: 'All activities', kind: 'all', parent: null, clears: 100, build_runs: 10, players: 9,
          parts: [[3, null, 'all.json', 2], [1, 2, 'all.more.json', 0]], summary: [[0, 0.25, 9], [1, 0.1, 800]] },
        { id: 'ultimate-conquest', name: 'Ultimate Conquest', kind: 'group', parent: null, clears: 50, build_runs: 5, players: 4,
          parts: [[3, null, 'ultimate-conquest.json', 1], [1, 2, 'ultimate-conquest.more.json', 1]],
          summary: [[1, 0.13, 832], [0, -0.05, 2]] },
      ],
      highlights: [['neutral', 'Neutral game', 'highlights.neutral.json'],
        ['ultimate-conquest', 'Ultimate Conquest', 'highlights.ultimate-conquest.json']],
    };
    // A highlights file: picks are [type, effect, players, runs, last, recipe, activity groups, novelty].
    const neutralFile = {
      format: 6, id: 'neutral', name: 'Neutral game', recipes: [top, titan],
      classes: [
        { class: 'Titan', picks: [[1, 0.1, 800, 1000, '2026-09-16', 1, 1, 1], [1, 0.05, 2, 3, '2026-09-01', 1, 1, 0.42]] },
        { class: 'Warlock', picks: [[0, 0.2, 9, 12, '2026-09-16', 0, 1, 1]] },
      ],
    };
    const log = document.getElementById('log');
    let failures = 0, passes = 0;
    const eq = (actual, expected, what) => {
      const a = JSON.stringify(actual), e = JSON.stringify(expected);
      if (a === e) { passes++; return; }
      failures++;
      log.append(Object.assign(document.createElement('div'), { className: 'fail', textContent: `FAIL ${what}: got ${a}, expected ${e}` }));
    };
    const state = (patch) => ({ ...DEFAULTS, ...patch });
    const types = (r) => r.rows.map((row) => row[0]);

    const model = prepare(data);
    const [allScope, ucScope] = data.scopes;
    eq(missingParts(allScope, 3), ['all.json'], 'the default minimum needs only the 3+ players part');
    eq(missingParts(ucScope, 1), ['ultimate-conquest.json', 'ultimate-conquest.more.json'], 'a minimum of 1 needs both parts');
    eq(model.appearances[0].map((a) => [a.scope.id, a.effect]), [['all', 0.25], ['ultimate-conquest', -0.05]], 'appearances come from the index');
    addPart(model, allScope, 'all.json', { format: 6, rows: allRows, recipes: [top, variant, titan] });
    addPart(model, ucScope, 'ultimate-conquest.json', { format: 6, rows: ucRows, recipes: [titan] });
    addPart(model, ucScope, 'ultimate-conquest.more.json', { format: 6, rows: ucMore, recipes: [top] });
    addPart(model, allScope, 'all.json', { format: 6, rows: allRows, recipes: [] });
    eq(allScope.rows.length, 2, 'a part is added once');
    eq([ucScope.rows[0][7][0], ucScope.rows[1][7][0]], [3, 4], 'picks are renumbered into the model');
    eq(model.recipe(4).id, '10', 'renumbered picks find their recipes');
    eq(missingParts(ucScope, 1), [], 'loaded parts are not fetched again');

    eq(pct(0), '±0%', 'pct zero');
    eq(pct(0.1), '+11%', 'pct positive');
    eq(pct(-0.5), '−39%', 'pct negative uses a minus sign');

    // Recipes decode exactly.
    const r = decodeRecipe(top);
    eq([r.id, r.kit.super, r.kit.fragments, r.armor[0].slot, r.armor[0].exotic, r.armor[0].mods],
      ['10', 1, [8], 3, true, [13, 13]], 'decoded kit and armor');
    eq([r.weapons[0].slot, r.weapons[0].item, r.weapons[0].frame, r.weapons[0].perks], [1, 9, 12, [11]], 'decoded weapon');
    eq([r.sets, r.setBonuses, r.artifactItem, r.artifact, r.artifactUnlocked], [[{ set: 18, pieces: 2, bonuses: [17] }], [17], null, [16], false], 'decoded sets and artifact');
    eq(decodeRecipe(titan).artifactUnlocked, true, 'unlocked (not applied) artifact perks are flagged');
    eq(rowRecipes(data.scopes[0].rows[0]), [0, 1], 'a row lists its top recipe and variants');

    // Listings, filters and sorting.
    eq(types(results(model, state({}))), [0, 1], 'by build effect');
    eq(types(results(model, state({ sort: 'top' }))), [1, 0], 'by top build');
    eq(types(results(model, state({ min: 10 }))), [1], 'minimum players');
    eq(types(results(model, state({ cls: 'Warlock' }))), [0], 'class');
    eq(types(results(model, state({ weapon: NONE }))), [0], 'no exotic weapon');
    eq(types(results(model, state({ aspect1: 'Heat Rises', aspect2: 'Icarus Dash' }))), [0], 'both aspects');
    eq(types(results(model, state({ aspect1: 'Heat Rises', aspect2: 'Howl of the Storm' }))), [], 'aspects are AND');
    eq(types(results(model, state({ has: 'Whisper of Chains' }))), [1], 'includes a fragment');
    eq(types(results(model, state({ has: 'Fatebringer' }))), [0], 'includes something only a variant has');
    eq(types(results(model, state({ has: 'Outlaw' }))), [0], 'includes a weapon perk');
    eq(types(results(model, state({ scope: 'ultimate-conquest', min: 2 }))), [1, 0], 'activity scope');
    eq(types(results(model, state({ scope: 'no-such-scope' }))), [0, 1], 'unknown scope falls back to all');

    eq([...recipeIncludes(model, 0).entries()].filter(([, k]) => k === 'armor_mod'), [['Hands-On', 'armor_mod']], 'mods are searchable');
    eq(recipeIncludes(model, 0).get('Getaway Artist'), undefined, 'the exotic armor is a type facet, not an include');
    const cls = facetOptions(model, state({ cls: 'Titan' }), 'cls');
    eq([...cls.entries()].sort(), [['Titan', 1], ['Warlock', 1]], 'class counts ignore the class filter');
    eq(facetOptions(model, state({ cls: 'Titan' }), 'has').get('Whisper of Chains'), 1, 'include counts follow other filters');
    eq(facetOptions(model, state({ cls: 'Titan' }), 'has').get('Fatebringer'), undefined, 'include counts exclude other classes');

    // Exact differences between recipes.
    const diff = recipeDiff(model, decodeRecipe(top), decodeRecipe(variant));
    eq(diff, [
      { label: 'Energy', text: 'The Mountaintop → Fatebringer' },
      { label: 'Armor mods', text: '+Firepower; −Hands-On' },
      { label: 'Stats', text: 'Grenade 200 → 190' },
    ], 'variant differences');
    eq(recipeDiff(model, decodeRecipe(top), decodeRecipe(top)), [], 'a recipe does not differ from itself');

    // Records.
    eq(pickLine([0, 0.1, 1, 1, '2026-09-01']), 'Used in 1 clear by 1 player · last 2026-09-01', 'a pick, without its effect');
    eq(topLine(allScope.rows[0]),
      'Used in 4 clears by 1 player · last 2026-09-15. Its loadout (same kit and weapons) was used in 5 clears across 2 exact builds.',
      'the top build and its loadout');

    // Share links: short ids match the catalog's (crates/db/src/catalog.rs).
    eq(shortId('2821109907461'), '00000005', 'short id');
    eq(shortId('-1'), '1264sgsf', 'short id of a negative build id');
    eq(buildLink(model.types[0], '2821109907461'),
      '#view=find&class=Warlock&element=Solar&armor=Getaway+Artist&weapon=%28none%29&super=Well+of+Radiance&aspect=Heat+Rises&aspect2=Icarus+Dash&build=00000005',
      'a book build links to the finder');
    eq(topLine(ucScope.rows[1]).endsWith('was used in 1 clear.'), true, 'a loadout of one build');
    eq(topLine(ucScope.rows[0]).endsWith('was used in 3 clears across 4 exact builds.'), true,
      'the loadout can hold builds that are not listed as variants');

    // URL state round-trips and drops defaults.
    const s = state({ scope: 'ultimate-conquest', cls: 'Titan', armor: 'Synthoceps', has: 'Whisper of Chains', min: 10, sort: 'top' });
    eq(parseHash(formatHash(s)), s, 'hash round trip');
    eq(formatHash(state({})), '', 'defaults give an empty hash');
    eq(parseHash('#min=abc&sort=bogus').min, DEFAULTS.min, 'bad minimum falls back');
    eq(parseHash('#min=abc&sort=bogus').sort, DEFAULTS.sort, 'bad sort falls back');

    eq(scopeLabel({ name: 'Vault of Glass: Master', parent: 'Master Raid' }), 'Master Raid · Vault of Glass: Master', 'scope label');
    eq(scopeLabel({ name: 'Ultimate Conquest: Lightblade', parent: 'Ultimate Conquest' }), 'Ultimate Conquest: Lightblade', 'scope label without repetition');

    let threw = false;
    try { prepare({ ...data, format: 4 }); } catch { threw = true; }
    eq(threw, true, 'data of another format is rejected');

    // ---- Find any build: the catalog --------------------------------------
    const T = '\t';
    const indexText = [
      'focalpoint-catalog 3', '@meta', `icon_base${T}https://www.bungie.net`,
      '@dict',
      `Ballidorse Wrathweavers${T}/b.jpg`, `Praxic Blade${T}`, `Winter's Wrath${T}`, `Frostpulse${T}`,
      `Glacial Harvest${T}`, `Repurposed Charge${T}`, `Whisper of Chains${T}`, `Shadebinder${T}`,
      `Exodus Down${T}${T}Armor set`, `Synthoceps${T}`,
      '@stats', `Weapons${T}/w.png`, `Health${T}`, `Class${T}`, `Grenade${T}`, `Super${T}`, `Melee${T}`,
      '@elements', `Stasis${T}/stasis.png`,
      '@activities', `Vault of Glass: Master${T}Master Raid`, `Equilibrium${T}Equilibrium`,
      '@types',
      ['Warlock', 'Stasis', '0', '1', '2', '3,4', '2', '5', '2', '0', '0,1'].join(T),
      ['Titan', 'Stasis', '9', '-', '-', '-', '1', '1', '1', '0', '1'].join(T),
    ].join('\n') + '\n';
    const shardText = [
      'focalpoint-shard 3',
      '@kits', '7 2 - - - - 3,4 6 -',
      '@weapons', '0 1 1 - - - -',
      '@armor', '1 0 1 - - - - -',
      '@artifact', '- - 1',
      '@sets', '8:4:5', '-',
      '@builds',
      'aaaaaaaa 0 0 0 0 0 0 1e,a,a,1e,2s,a 3 1 2 1 fz9 2s 0',
      'bbbbbbbb 0 0 0 0 0 1 - 2 1 0 0 fz8 - 1',
      'cccccccc 1 0 - - 0 1 - 1 1 1 0 fz7 - 1',
    ].join('\n') + '\n';
    const cat = parseIndex(indexText);
    const builds = parseShard(shardText);
    const fstate = (patch) => ({ ...FIND_DEFAULTS, has: [], build: '', ...patch });
    const bids = (list) => list.map((b) => b.id);

    eq(cat.types.length, 2, 'catalog types');
    eq([cat.types[0].armorName, cat.types[0].weaponName, cat.types[0].superName, cat.types[0].aspectNames],
      ['Ballidorse Wrathweavers', 'Praxic Blade', "Winter's Wrath", ['Frostpulse', 'Glacial Harvest']], 'type names');
    eq(cat.types[1].weaponName, null, 'no exotic weapon');
    eq([...typeFacet(cat, fstate({}), 'cls').entries()].sort(), [['Titan', 1], ['Warlock', 2]], 'class facet counts builds');
    eq(matchingTypes(cat, fstate({ armor: 'Ballidorse Wrathweavers', weapon: 'Praxic Blade' })).map((t) => t.id), [0], 'type filters');
    eq(matchingTypes(cat, fstate({ weapon: NONE })).map((t) => t.id), [1], 'no exotic weapon filter');
    eq(matchingTypes(cat, fstate({ act: 'Master Raid' })).map((t) => t.id), [0], 'activity group filter');
    eq(activityFacet(cat, fstate({})).get('Equilibrium|Equilibrium'), 3, 'activity facet');
    eq(shardsOf(cat.types), [0], 'shards of types');

    eq(builds.length, 3, 'shard builds');
    const a = builds[0];
    eq([a.recipe.kit.subclass, a.recipe.kit.fragments, a.recipe.armor[0].item, a.recipe.armor[0].exotic, a.recipe.weapons[0].item],
      [7, [6], 0, true, 1], 'decoded catalog recipe');
    eq([a.recipe.sets, a.recipe.setBonuses, a.recipe.stats], [[{ set: 8, pieces: 4, bonuses: [5] }], [5], [50, 10, 10, 50, 100, 10]], 'sets and stats');
    eq([a.recipe.artifactItem, a.recipe.artifact, a.recipe.artifactUnlocked], [null, [], true], 'artifact');
    eq([cat.data.stats[0], cat.data.elements.Stasis, cat.dict[8][2]], [['Weapons', '/w.png'], '/stasis.png', 'Armor set'], 'catalog stats, elements and types');
    eq([a.runs, a.clears, a.qualified, a.effect, a.activities], [3, 2, 1, 0.1, [0]], 'build record');
    eq(builds[1].effect, null, 'an unranked build');

    const ballidorse = matchingTypes(cat, fstate({ armor: 'Ballidorse Wrathweavers' }));
    eq(bids(matchingBuilds(cat, builds, ballidorse, fstate({}))), ['aaaaaaaa', 'bbbbbbbb'], 'ranked builds first');
    eq(bids(matchingBuilds(cat, builds, ballidorse, fstate({ has: ['Repurposed Charge'] }))), ['aaaaaaaa'], 'includes a set bonus');
    eq(bids(matchingBuilds(cat, builds, ballidorse, fstate({ has: ['Repurposed Charge', 'Whisper of Chains'] }))), ['aaaaaaaa'], 'includes are AND');
    eq(bids(matchingBuilds(cat, builds, ballidorse, fstate({ act: 'Equilibrium' }))), ['bbbbbbbb'], 'activity at build level');
    eq(bids(matchingBuilds(cat, builds, ballidorse, fstate({ sort: 'recent' }))), ['aaaaaaaa', 'bbbbbbbb'], 'sort by recency');
    eq(includeFacet(cat, builds.slice(0, 2)).get('Repurposed Charge'), ['set_bonus', 1], 'includes facet');
    eq(bids(matchingBuilds(cat, builds, ballidorse, fstate({ build: 'bbbbbbbb' }))), ['bbbbbbbb'], 'a shared build alone');
    eq(parseFindHash(buildHash(cat.types[0], 'aaaaaaaa')).build, 'aaaaaaaa', 'a finder build link');
    eq(bids(matchingBuilds(cat, builds, matchingTypes(cat, parseFindHash(buildHash(cat.types[0], 'aaaaaaaa'))),
      parseFindHash(buildHash(cat.types[0], 'aaaaaaaa')))), ['aaaaaaaa'], 'a build link finds its build');

    const fs = fstate({ armor: 'Ballidorse Wrathweavers', act: 'Master Raid|Vault of Glass: Master', has: ['Repurposed Charge', 'Whisper of Chains'], sort: 'clears' });
    eq(parseFindHash(formatFindHash(fs)), fs, 'finder hash round trip');
    eq(formatFindHash(fstate({})), '#view=find', 'finder defaults');
    eq(findHash(model.types[0]), '#view=find&class=Warlock&element=Solar&armor=Getaway+Artist&weapon=%28none%29&super=Well+of+Radiance&aspect=Heat+Rises&aspect2=Icarus+Dash', 'book to finder link');
    eq(bookHash(cat.types[1]), '#class=Titan&element=Stasis&armor=Synthoceps&weapon=%28none%29', 'finder to book link');

    // Highlights.
    eq([viewOf(''), viewOf('#view=find'), viewOf('#view=highlights&class=Titan'), viewOf('#view=nope')],
      ['book', 'find', 'highlights', 'book'], 'the view a URL asks for');
    const hs = { set: 'ultimate-conquest', cls: 'Titan' };
    eq(formatHighlightHash(hs), '#view=highlights&set=ultimate-conquest&class=Titan', 'highlights hash');
    eq(parseHighlightHash(formatHighlightHash(hs)), hs, 'highlights hash round trip');
    eq(parseHighlightHash('#view=highlights&class=Nobody'), { ...HIGHLIGHT_DEFAULTS }, 'unknown classes fall back');
    eq(picksOf(neutralFile, 'Titan').map((p) => p[1]), [0.1, 0.05], 'a class’s picks');
    eq(picksOf(neutralFile, 'Hunter'), [], 'a class without highlights');
    const mixed = [[1, 0.1], [0, 0.2], [1, 0.05]];
    eq(bySubclass(model.types, mixed).map(([el, ps]) => [el, ps.length]), [['Solar', 1], ['Stasis', 2]], 'picks grouped by subclass in order');
    const ranked = parseHash(rankedHash(model.types[1], 'ultimate-conquest'));
    eq([ranked.scope, ranked.cls, ranked.armor, ranked.weapon, ranked.aspect1, ranked.min],
      ['ultimate-conquest', 'Titan', 'Synthoceps', 'Ice Breaker', 'Howl of the Storm', 1], 'a highlight links to its ranked listing');
    eq(noveltyLine(0, 1, 'Solar'), 'The best-ranked Solar build here.', 'the first pick');
    eq(noveltyLine(1, 0.873, 'Solar'), '87% of what defines its playstyle is new compared with the Solar picks above.', 'a later pick');

    // The view itself, on a fixture page.
    const page = document.createElement('div');
    page.innerHTML = `<select id="hl-set"></select><p id="hl-note"></p><p id="hl-summary"></p><div id="hl-results"></div>
      ${['Hunter', 'Titan', 'Warlock'].map((c) => `<input type="radio" name="hl-class" value="${c}">`).join('')}`;
    const before = location.hash;
    history.replaceState(null, '', '#view=highlights&class=Titan');
    const loaded = [];
    await startHighlights(page, data, async (url) => { loaded.push(url); return neutralFile; });
    eq(loaded, ['data/book/highlights.neutral.json'], 'the neutral set loads on demand');
    eq(page.querySelectorAll('#hl-results li.card').length, 2, 'every Titan pick is shown');
    eq([...page.querySelectorAll('.subclass-heading')].map((x) => x.textContent), ['Stasis'], 'under its subclass heading');
    eq(page.querySelector('#hl-summary').textContent, '2 Titan builds for the neutral game', 'the summary');
    eq([...page.querySelectorAll('#hl-set option')].map((o) => o.value), ['neutral', 'ultimate-conquest'], 'the set picker');
    eq(page.querySelector('.highlight .metrics').textContent.includes('used in 1 of 1 activity groups'), true, 'neutral picks say where they were used');
    history.replaceState(null, '', before || location.pathname);

    const verdict = document.getElementById('verdict');
    verdict.className = failures ? 'fail' : 'pass';
    verdict.textContent = failures ? `FAILED: ${failures} of ${passes + failures}` : `PASSED: ${passes} checks`;
  </script>
</body>
</html>
