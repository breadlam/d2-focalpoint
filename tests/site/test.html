<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site logic tests</title>
  <style>body { font: 14px/1.5 monospace; margin: 16px; } .fail { color: #b83a26; } .pass { color: #187a44; }</style>
</head>
<body>
  <h1>site/app.js logic tests</h1>
  <p>Serve the repository root (<code>python3 -m http.server</code>) and open
    <code>/tests/site/test.html</code>. The verdict is in <code>#verdict</code>.</p>
  <pre id="log"></pre>
  <p id="verdict">running…</p>
  <script type="module">
    import {
      DEFAULTS, NONE, RUN_WITH_MIN, facetOptions, formatHash, matches, parseHash, pct, prepare, results, scopeLabel,
    } from '../../site/app.js';

    // Three groups; two scopes. Rows: [group, effect, raw, skill, players, runs, last].
    const data = {
      format: 1, imported_at: '', first_run: '2026-06-09', last_run: '2026-09-16',
      icon_base: 'https://www.bungie.net', icons: {},
      names: ['Ember of Char', 'Whisper of Chains', 'The Mountaintop'],
      groups: [
        { class: 'Warlock', element: 'Solar', armor: null, weapon: null, super: 'Well of Radiance',
          aspects: ['Heat Rises', 'Icarus Dash'],
          details: { runs: 12, stats: [1, 1, 1, 2, 2, 1], components: { fragments: [[0, 89]], weapons: [[2, 24]] } } },
        { class: 'Warlock', element: 'Prismatic', armor: 'Getaway Artist', weapon: 'Khvostov 7G-0X', super: 'Song of Flame',
          aspects: ['Hellion', "Weaver's Call"],
          details: { runs: 50, stats: [0, 0, 0, 4, 2, 0], components: { fragments: [[1, RUN_WITH_MIN - 1]] } } },
        { class: 'Titan', element: 'Stasis', armor: 'Synthoceps', weapon: 'Ice Breaker', super: 'Glacial Quake',
          aspects: ['Howl of the Storm', 'Tectonic Harvest'],
          details: { runs: 900, stats: [2, 1, 1, 2, 2, 3], components: { fragments: [[1, 60]] } } },
      ],
      scopes: [
        { id: 'all', name: 'All activities', kind: 'all', parent: null, clears: 100, build_runs: 10, players: 9,
          rows: [[0, 0.25, 0.8, 0.2, 9, 12, '2026-09-16'], [1, 0.22, 0.4, 0.1, 40, 52, '2026-09-15'], [2, 0.1, 0.3, 0.1, 800, 1000, '2026-09-16']] },
        { id: 'ultimate-conquest', name: 'Ultimate Conquest', kind: 'group', parent: null, clears: 50, build_runs: 5, players: 4,
          rows: [[2, 0.13, 0.27, 0.1, 832, 1000, '2026-09-16'], [1, -0.05, 0.1, 0.1, 2, 3, '2026-09-01']] },
      ],
    };

    const log = document.getElementById('log');
    let failures = 0, passes = 0;
    const eq = (actual, expected, what) => {
      const a = JSON.stringify(actual), e = JSON.stringify(expected);
      if (a === e) { passes++; return; }
      failures++;
      log.append(Object.assign(document.createElement('div'), { className: 'fail', textContent: `FAIL ${what}: got ${a}, expected ${e}` }));
    };
    const state = (patch) => ({ ...DEFAULTS, ...patch });
    const ids = (r) => r.rows.map((row) => row[0]);

    const model = prepare(data);

    eq(pct(0), '±0%', 'pct zero');
    eq(pct(0.1), '+11%', 'pct positive');
    eq(pct(-0.5), '−39%', 'pct negative uses a minus sign');

    eq(ids(results(model, state({}))), [0, 1, 2], 'all builds by effect');
    eq(ids(results(model, state({ min: 10 }))), [1, 2], 'minimum players');
    eq(ids(results(model, state({ sort: 'players' }))), [2, 1, 0], 'sort by players');
    eq(ids(results(model, state({ cls: 'Warlock' }))), [0, 1], 'class');
    eq(ids(results(model, state({ armor: NONE }))), [0], 'no exotic armor');
    eq(ids(results(model, state({ aspect1: 'Hellion', aspect2: "Weaver's Call" }))), [1], 'both aspects');
    eq(ids(results(model, state({ aspect1: 'Hellion', aspect2: 'Icarus Dash' }))), [], 'aspects are AND');
    eq(ids(results(model, state({ with: 'Whisper of Chains' }))), [2], 'run with needs the minimum share');
    eq(ids(results(model, state({ scope: 'ultimate-conquest', min: 2 }))), [2, 1], 'activity scope');
    eq(ids(results(model, state({ scope: 'no-such-scope' }))), [0, 1, 2], 'unknown scope falls back to all');

    // Facet counts honour every other filter but their own.
    const cls = facetOptions(model, state({ cls: 'Titan' }), 'cls');
    eq([...cls.entries()].sort(), [['Titan', 1], ['Warlock', 2]], 'class counts ignore the class filter');
    const armor = facetOptions(model, state({ cls: 'Warlock' }), 'armor');
    eq([...armor.entries()].sort(), [[NONE, 1], ['Getaway Artist', 1]], 'armor counts follow the class filter');
    eq(matches(model, model.groups[2], state({ cls: 'Warlock' }), 'cls'), true, 'skip ignores a facet');

    // URL state round-trips and drops defaults.
    const s = state({ scope: 'ultimate-conquest', cls: 'Titan', armor: 'Synthoceps', min: 10, sort: 'raw' });
    eq(parseHash(formatHash(s)), s, 'hash round trip');
    eq(formatHash(state({})), '', 'defaults give an empty hash');
    eq(parseHash('#min=abc&sort=bogus').min, DEFAULTS.min, 'bad minimum falls back');
    eq(parseHash('#min=abc&sort=bogus').sort, DEFAULTS.sort, 'bad sort falls back');

    eq(scopeLabel({ name: 'Vault of Glass: Master', parent: 'Master Raid' }), 'Master Raid · Vault of Glass: Master', 'scope label');
    eq(scopeLabel({ name: 'Ultimate Conquest: Lightblade', parent: 'Ultimate Conquest' }), 'Ultimate Conquest: Lightblade', 'scope label without repetition');

    let threw = false;
    try { prepare({ ...data, format: 99 }); } catch { threw = true; }
    eq(threw, true, 'unknown data format is rejected');

    const verdict = document.getElementById('verdict');
    verdict.className = failures ? 'fail' : 'pass';
    verdict.textContent = failures ? `FAILED: ${failures} of ${passes + failures}` : `PASSED: ${passes} checks`;
  </script>
</body>
</html>
