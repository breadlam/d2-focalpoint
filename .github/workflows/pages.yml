# Publish the static build-ranking site (site/) to GitHub Pages.
#
# The data (site/data/focalpoint.json) is exported locally with
# `focalpoint site` and committed: the analysis database is built from
# private backups and is not available here. See docs/site.md.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
name: Publish site

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the exported data is present
        run: test -s site/data/focalpoint.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
