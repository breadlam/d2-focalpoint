# Publish the static build-ranking site (site/) to GitHub Pages.
#
# The data (site/data/book/ and site/data/catalog/) is exported locally with
# `focalpoint site` and committed: the analysis database is built from
# private backups and is not available here. See docs/site.md.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
name: Publish site

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy are separate jobs, as in GitHub's other Pages starters:
  # deploy-pages looks the artifact up by name, and right after an upload in
  # the same job the lookup can come back empty (actions/deploy-pages#451).
  # Separate jobs also let a failed deploy be re-run without re-uploading,
  # which would leave two artifacts and fail the lookup again.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the exported data is present
        run: test -s site/data/book/index.json && test -s site/data/book/highlights.neutral.json && test -s site/data/catalog/index.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
