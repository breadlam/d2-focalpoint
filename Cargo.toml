[workspace]
resolver = "3"
members = ["crates/core", "crates/db", "crates/import", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/breadlam/searchlight-cli"

[workspace.dependencies]
searchlight-core = { path = "crates/core" }
searchlight-db = { path = "crates/db" }
searchlight-import = { path = "crates/import" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
comfy-table = "8"
crossbeam-channel = "0.5"
dirs = "7"
duckdb = { version = "1.20000", features = ["bundled"] }
flate2 = "1"
indicatif = "0.18"
rayon = "1.12"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the domain more than they help: Bungie ids and
# hashes are routinely converted between u32/u64/i64 at storage boundaries.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
# The only panics are lock poisoning and constant-template expects.
missing_panics_doc = "allow"

[profile.release]
debug = "line-tables-only"

# Debug info for the bundled C++ engine alone would make the binary ~1.5 GB.
[profile.release.package.libduckdb-sys]
debug = false

# DuckDB's bundled C++ build dominates compile time; optimise dependencies even
# in dev builds so local imports over real data are not painfully slow.
[profile.dev.package."*"]
opt-level = 2
