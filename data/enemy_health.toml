# Enemy health measured in-game (docs/durability.md).
#
# health: the damage it took to kill the enemy, as the game's damage numbers
#   show it (approximate when `approximate`).
# archetype, rank: the enemy in MossyMax's tables (enemy_health) it is
#   compared with — rank minor or elite as the closest match, or champion
#   (compared with the Data Compendium's Champion health).
# place, step, power_delta: where it was measured.
# `focalpoint mechanics import` writes these to the table enemy_observed;
# the view enemy_observed_tier compares each with MossyMax's health tiers.

[[measurement]]
enemy = "Psion"
faction = "Cabal"
archetype = "Psion"
rank = "minor"
place = "Shooting Range"
step = "Ultimate"
power_delta = -30
health = 125
approximate = true
source = "In-game, Shooting Range (recorded 2026-11-21)"

