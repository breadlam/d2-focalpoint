# Power delta and enemy health tier of the activity groups and activities
# (docs/durability.md).
#
# An enemy's damage to kill is its health at the activity's health tier
# (MossyMax's enemy health tables, 1–4) divided by the outgoing damage
# multiplier of the Power delta the activity is fought at (Edge of Fate's
# curve: ×0.446 at −30, ×0.144 at −50). `focalpoint mechanics import`
# turns each entry into features of its context and the context's
# descendants: power_delta, damage_multiplier, durability (its inverse),
# power_cap, combatant_power, health_tier, champion_difficulty,
# difficulty_confidence and difficulty_evidence.
#
# context: the name of an activity group or an activity. Groups' entries
#   apply first; an activity's entry replaces the features it gives.
# power_cap, combatant_power: the Power players are capped at and the
#   combatants' Power; the delta is their difference (power_delta may be
#   given instead, or as well, when it agrees).
# confidence:
#   documented — a current (Monument of Triumph) source states it
#   dated      — a source from before Edge of Fate, or superseded, states it
#   assumed    — inferred; replace when a source is found
# Entries naming no context (activities Searchlight did not target) are kept
# for reference. A context with no entry has no durability features yet.
#
# Champion difficulty names a column of the Data Compendium's Champion
# tables: Standard | Raid (Expert/Master) | Advanced | Expert |
# Master Grandmaster.
#
# What is known:
# * Conquests (in-game, 2026-11-21): Expert −20, Master −30, Grandmaster
#   −40, Ultimate −50; their ladder's activity level is the combatants'
#   Power / 10 for all twelve.
# * Edge of Fate (9.0.0.1 patch notes, July 2025) set the Portal's steps
#   at Normal 0, Advanced −10, Expert −20, Master −30, Grandmaster −40,
#   Ultimate −50, and made red-bar enemies gain health more slowly with
#   delta than majors and bosses.
# * The Data Compendium (current) gives Ultimate −30 and the Grandmaster
#   Alert −50: the Portal's Ultimate was eased after launch.
# * `focalpoint analyze difficulty`: the same players in the same Ops kill
#   ×0.89 as fast at Ultimate as at Master and ×0.64 as fast as at Normal —
#   consistent with enemies needing ×2.2 the damage (−30), not ×7 (−50).

[[difficulty]]
context = "Ultimate Fireteam Op"
power_delta = -30
health_tier = 4
champion_difficulty = "Master Grandmaster"
confidence = "documented"
sources = [
  "Data Compendium, landing: \"-50 (Grandmaster Alert) vs -30 (Ultimate)\"; \"-30 Delta: +85% Incoming and 0.446x Outgoing\"",
  "focalpoint analyze difficulty: kill rate x0.894 of the same players' Master clears",
]
note = "Edge of Fate launched Ultimate at -50 (9.0.0.1 patch notes); health tier 4 and the Champion column are assumed."

