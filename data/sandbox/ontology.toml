[[event]]
name = "volatile_explosion"
attributes = ["rank"]
description = "A Volatile enemy explodes."

[[event]]
name = "freeze"
attributes = ["rank"]
description = "An enemy is frozen (Slow reached 100, or frozen directly)."

[[event]]
name = "shatter"
