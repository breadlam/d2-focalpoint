description = "The player picks up an object (an Orb of Power, an elemental pickup, ammo)."

[[event]]
name = "finisher"
attributes = ["rank"]
description = "The player performs a finisher."

[[event]]
name = "reload"
attributes = ["ammo"]
description = "The player reloads."

[[event]]
name = "movement"
attributes = ["kind"]
description = "Sprint, slide, airborne, crouch, grapple, glide; `kind` names which."

[[event]]
name = "apply"
attributes = ["state", "by", "element"]
description = "The player applies a state (buff or debuff) to themselves, an ally or an enemy."

[[event]]
name = "gain"
attributes = ["state"]
description = "The player gains a buff or a stack of it."

[[event]]
name = "expire"
attributes = ["state"]
description = "A state ends."

[[event]]
name = "counter_full"
attributes = ["counter"]
description = "A part's counter reaches its threshold."

[[event]]
name = "ignition"
