# The build model's closed vocabulary (docs/build-model.md, docs/sandbox.md).
#
# Part cards (data/sandbox/parts/) may only use the names defined here: an
# unknown event, state, parameter or attribute value is an error. The core
# verbs' parameters are their PvE values, each with its source:
#   compendium:<tab>/<entry>   the Destiny Data Compendium
#   court:<tab>/<entry>        Court's damage buff/debuff guides
#   cooldowns:<tab>/<row>      the ability cooldowns and factors workbook
#   mossymax:<tab>             MossyMax's damage scaling sheets
#   endgame:<tab>/<entry>      Endgame Analysis
#   bungie:<patch>             Bungie's patch notes
#   ingame:<date>              measured in-game
#   clarity:<hash>             Clarity's database (its public repository)
# Parameters whose value no source gives are listed without one.

[vocabulary]
elements = ["kinetic", "arc", "solar", "void", "stasis", "strand"]
light = ["arc", "solar", "void"]
darkness = ["stasis", "strand"]
abilities = ["grenade", "melee", "class", "super", "movement"]
ammo = ["primary", "special", "heavy"]
# What dealt the damage or the kill.
sources = ["weapon", "grenade", "melee", "class", "super", "ability", "verb", "finisher", "environment", "any"]
# Health-bar ranks (combatant ranks) and Champion types.
ranks = ["minor", "elite", "miniboss", "champion", "boss", "vehicle", "guardian"]
champions = ["barrier", "overload", "unstoppable"]
# Combatant tiers (Compendium: "Combatant Tiers =/= Combatant Ranks"):
# a type's base tier, raised by its rank; effects that scale "by enemy
# rank" in the sources use these.
tiers = [1, 2, 3, 4, 5, 6]
# Court's damage modifier categories: highest-only within global_debuff,
# empowering and surge; everything multiplies across categories.
damage_categories = ["global_debuff", "empowering", "surge", "amplification", "exotic", "weapon_perk", "world"]
exclusive_categories = ["global_debuff", "empowering", "surge"]
# Who an effect lands on.
targets = ["self", "allies", "fireteam", "target", "area", "enemies_hit", "nearest", "objects"]
# Labels a damage instance carries, for modifiers to select ("ignition
# damage", "powered melee damage").
damage_tags = [
  "any", "weapon", "ability", "grenade", "melee", "powered_melee", "class", "super", "finisher",
  "ignition", "scorch", "jolt", "volatile", "shatter", "crystal", "unravel", "threadling",
  "tangle", "bolt", "explosion",
]
# Parameters every ability has: `melee.charges`, `grenade.cooldown`, ...
ability_params = ["charges", "cooldown", "regen", "flat_gain", "damage", "duration", "radius", "damage_resist"]
movement = ["sprint", "slide", "airborne", "crouch", "jump", "grapple", "glide"]
# Character stats (Armor 3.0) and weapon stats a modifier may change.
stats = [
  "weapons", "health", "class", "grenade", "super", "melee",
  "handling", "reload", "range", "stability", "aim_assist", "airborne", "mobility", "magazine", "zoom",
]
# The families a source citation starts with.
source_families = ["compendium", "court", "cooldowns", "mossymax", "endgame", "bungie", "ingame", "clarity", "aegis", "manifest"]

# ---------------------------------------------------------------- events

[[event]]
name = "kill"
attributes = ["source", "element", "precision", "rank", "tier", "target_has", "ammo", "powered", "multikill"]
description = "The player (or a summon of theirs) kills an enemy."

[[event]]
name = "hit"
attributes = ["source", "element", "precision", "rank", "tier", "target_has", "ammo", "powered"]
description = "The player deals a damage instance."

[[event]]
name = "cast"
attributes = ["ability", "powered"]
description = "The player uses an ability (a powered melee is a melee cast)."

[[event]]
name = "super_end"
attributes = []
description = "The player's super ends."

[[event]]
name = "damage_taken"
attributes = ["from", "melee"]
description = "The player takes damage."

[[event]]
name = "pickup"
