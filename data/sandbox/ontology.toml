description = "A frozen enemy or a Stasis Crystal is shattered; `of` is enemy or crystal."

[[event]]
name = "crystal_created"
attributes = ["size"]
description = "A Stasis Crystal is created."

[[event]]
name = "suspend"
attributes = ["rank"]
description = "An enemy is suspended."

[[event]]
name = "unravel_thread"
attributes = []
description = "An Unraveled enemy releases threads."

[[event]]
name = "tangle_detonated"
attributes = []
description = "A Tangle is detonated."

[[event]]
name = "threadling_hit"
attributes = []
description = "A Threadling explodes on an enemy."

[[event]]
name = "bolt_discharge"
attributes = []
description = "x10 Bolt Charge discharges an Arc Bolt."

[[event]]
name = "orb_created"
attributes = ["by"]
description = "An Orb of Power is created."

[[event]]
name = "champion_stunned"
attributes = ["champion"]
description = "A Champion is stunned."

[[event]]
name = "transcendence"
attributes = []
description = "The player activates Transcendence."

[[event]]
name = "tick"
attributes = ["state"]
description = "A damage-over-time state ticks (Scorch every 0.56 s)."

[[event]]
name = "periodic"
