# Artifact perks (docs/sandbox.md).

[[part]]
name = "Solar Fulmination"
kind = "artifact_perk"
sources = ["compendium:Artifact Perks/Hunter's Journal (Echoes)/Solar Fulmination"]
note = "With Ember of Char, each Fulmination also Scorches what it hits: Char's rule fires on every ignition_hit, Fulminations included, so a neighbour takes x60 from the ignition and x60 from the Fulmination, enough to ignite."

# Each ignition adds a second damage instance that counts as an ignition
# (so ignition modifiers and on-ignition rules apply to it), without
# falloff, but does not itself trigger another Fulmination.
[[part.rule]]
on = { event = "ignition", fulmination = false }
effect = { emit = "ignition", attributes = { fulmination = true }, damage = 171, radius = 12, falloff = 1.0, element = "solar", tags = ["ignition"] }

[[part]]
name = "Crystalline Converter"
kind = "artifact_perk"
sources = ["compendium:Artifact Perks/Tablet of Ruin (Heresy)/Crystalline Converter"]

[[part.counter]]
name = "shards_picked"
threshold = 15
note = "Stasis Shard pickups since the last Stasis melee hit."

[[part.counter]]
name = "primed"
threshold = 1
note = "Set by a class ability: the next Stasis weapon kill spawns a shard."

[[part.rule]]
on = { event = "pickup", object = "stasis_shard" }
effect = { progress = "shards_picked", amount = 1 }

# A Stasis melee hit (Diamond Lance too, not modelled) spends the count:
# 8, 12 or 15 pickups spawn 1, 2 or 3 crystals.
[[part.rule]]
on = { event = "hit", source = "melee", element = "stasis" }
when = [{ stacks = "shards_picked", min = 8 }]
effect = [
  { spawn = "stasis_crystal", count = { by_counter = [[8, 1], [12, 2], [15, 3]], counter = "shards_picked" }, size = "medium" },
  { consume = "shards_picked" },
]
note = "The crystals' size is not stated; medium is assumed."

[[part.rule]]
on = { event = "cast", ability = "class" }
effect = { progress = "primed", amount = 1 }

[[part.rule]]
on = { event = "kill", source = "weapon", element = "stasis" }
when = [{ stacks = "primed", min = 1 }]
effect = [{ spawn = "stasis_shard", count = 1 }, { consume = "primed" }]
