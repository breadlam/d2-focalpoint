# Stasis parts (docs/sandbox.md).

[[part]]
name = "Howl of the Storm"
kind = "aspect"
sources = ["compendium:Stasis/Aspect/Howl of the Storm", "clarity:1563930741"]

[[part.modify]]
param = "melee.charges"
add = 1

# The sliding uppercut: 146 melee damage, freezes nearby enemies, and two
# lines of crystals (2 small, 4 medium, 2 large) whose shatters deal 158
# powered Stasis melee damage, down to 45% over 8 m.
[[part.rule]]
on = { event = "cast", ability = "melee" }
when = [{ movement = "slide" }]
effect = [
  { damage = 146, element = "stasis", source = "melee", tags = ["melee", "powered_melee"] },
  { apply = "frozen", target = "area" },
  { spawn = "stasis_crystal", sizes = { small = 2, medium = 4, large = 2 }, source = "melee", tags = ["powered_melee", "crystal"], falloff = 0.45 },
]
note = "The freeze radius is not stated."

[[part.modify]]
damage = "powered_melee"
element = "stasis"
mul = 1.5
when = [{ target_has = "frozen" }, { target_rank_not = ["boss"] }]
note = "Howl's own damage against frozen non-boss enemies."

[[part]]
name = "Tectonic Harvest"
kind = "aspect"
sources = ["compendium:Stasis/Aspect/Tectonic Harvest", "clarity:2031919264"]
note = "Not carded: taking damage while Frost Armor is active grants melee energy, at most once a second; no source gives the amount."

[[part.counter]]
name = "harvest_shatter"
threshold = 1
note = "Kinetic and Stasis weapon kills while Frost Armor is active progress it; more stacks, more progress."

[[part.rule]]
on = { event = "pickup", object = "stasis_shard", size = "small" }
effect = [{ heal = 10 }, { apply = "frost_armor", stacks = 1, target = "self" }]

[[part.rule]]
on = { event = "pickup", object = "stasis_shard", size = "large" }
effect = [{ heal = 20 }, { apply = "frost_armor", stacks = 3, target = "self" }]
sources = ["clarity:2031919264"]
note = "The Compendium leaves the large shard's healing unknown; Clarity gives 20 HP."

[[part.rule]]
on = { event = "kill", source = "weapon" }
when = [{ has = "frost_armor" }]
effect = { progress = "harvest_shatter", amount = 0.2 }
confidence = "assumed"
note = "Kinetic and Stasis weapon kills only; the progress per kill (rising with Frost Armor stacks) is not documented."

[[part.rule]]
on = { event = "counter_full", counter = "harvest_shatter" }
effect = [{ emit = "shatter", attributes = { of = "enemy" } }, { consume = "harvest_shatter" }]

[[part]]
name = "Whisper of Hunger"
kind = "fragment"
sources = ["compendium:Stasis/Fragments/Hunger", "clarity:2483898431"]
note = "The sources disagree: the Compendium has +60% (additive with other increases: 10% -> 16%, 50% -> 80%); Clarity has 10% -> 17.5% and 50% -> 75%. The Compendium's is used."

[[part.modify]]
param = "stasis_shard.melee_energy_small"
mul = 1.6

[[part.modify]]
param = "stasis_shard.melee_energy_large"
mul = 1.6

[[part]]
name = "Whisper of Conduction"
kind = "fragment"
sources = ["compendium:Stasis/Fragments/Conduction", "clarity:2483898429"]

[[part.modify]]
param = "stasis_shard.pickup_radius"
set = 15
note = "Shards within 15 m are pulled to the player after 1 s."

[[part]]
name = "Whisper of Rime"
kind = "fragment"
sources = ["compendium:Stasis/Fragments/Rime", "compendium:Stasis/Glossary/Frost Armor", "clarity:2483898430"]

[[part.modify]]
param = "frost_armor.max_stacks"
set = 7

[[part.modify]]
param = "frost_armor.damage_resist_max"
set = 0.50

[[part.modify]]
param = "frost_armor.stack_duration"
set = 6

[[part]]
name = "Glacial Quake"
kind = "super"
sources = ["compendium:Stasis/Super Abilities/Glacial Quake"]
note = "Partial: contact damage (300 every 0.15 s to frozen enemies and crystals), the light and heavy attacks, and Glacial Howl (15% super energy per uppercut) are not yet carded."

[[part.modify]]
param = "super.duration"
set = 25

[[part.modify]]
param = "super.damage_resist"
set = 0.90

[[part.rule]]
on = { event = "cast", ability = "super" }
effect = { apply = "frozen", target = "area", radius = 8 }

[[part.rule]]
on = "kill"
when = [{ in_super = true }]
effect = { spawn = "orb_of_power", count = 1 }
limit = 7
note = "Each of these Orbs grants 7.15% ability energy."

[[part.rule]]
on = "super_end"
effect = { charges = "melee", count = 3 }

[[part.modify]]
damage = "any"
element = "stasis"
mul = 4.1
when = [{ in_super = true }, { target_has = "frozen" }]
note = "All Stasis damage against frozen enemies (light attacks and contact damage aside) is +310% and counts as super damage."
