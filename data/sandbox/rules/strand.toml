on = { event = "cast", ability = "super" }
effect = [
  { damage = 783, times = 9, element = "strand", source = "super", tags = ["super"] },
  { spawn = "threadling", count = 9 },
]

[[rule]]
granted_by = "super:Bladefury"
sources = ["compendium:Strand/Super Abilities/Bladefury"]
on = { event = "cast", ability = "super" }
effect = { damage = 851, times = 25, target = "area", radius = 3, element = "strand", source = "super", tags = ["super"] }
confidence = "assumed"
note = "Light attacks drain 3% against 4.167% a second: about 25 a cast."

[[rule]]
granted_by = "super:Bladefury"
sources = ["compendium:Strand/Super Abilities/Bladefury"]
on = "super_end"
effect = { charges = "melee", count = 3 }

[[rule]]
granted_by = "super:Silkstrike"
sources = ["compendium:Strand/Super Abilities/Silkstrike"]
on = { event = "cast", ability = "super" }
effect = { damage = 1638, times = 12, element = "strand", source = "super", tags = ["super"] }
confidence = "assumed"
note = "Light attacks drain 4% against 4% a second: about twelve a cast."

[[rule]]
granted_by = "super:Silkstrike"
sources = ["compendium:Strand/Super Abilities/Silkstrike"]
on = { event = "kill", source = "super" }
effect = { damage = 1293, target = "area", radius = 5, element = "strand", source = "super", tags = ["super"] }
