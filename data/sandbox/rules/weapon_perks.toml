# Weapon perks and origin traits that act on abilities and verbs
# (docs/sandbox.md). Weapons' own damage is not modelled: weapon kills are
# the enemies abilities leave (`rates`). A perk sits on one weapon, so it
# fires on the share of weapon kills that weapon makes,
# `policy.perk_weapon_share`. Perks that fire on hits are taken once a
# weapon kill.

# ------------------------------------------------------------------ verbs

[[rule]]
granted_by = "weapon_perk:Incandescent"
sources = ["compendium:Weapon Perks/Incandescent"]
on = { event = "kill", source = "weapon" }
effect = [
  { damage = 30, target = "area", radius = 4, element = "solar", source = "weapon" },
  { apply = "scorch", stacks = 40, target = "area", radius = 4 },
]
chance = { var = "policy.perk_weapon_share" }
note = "Elites explode bigger (x55 over 8 m): the minor's taken."

[[rule]]
granted_by = "weapon_perk:Destabilizing Rounds"
sources = ["compendium:Weapon Perks/Destabilizing Rounds"]
on = { event = "kill", source = "weapon" }
effect = { apply = "volatile", target = "area", radius = 7 }
chance = { var = "policy.perk_weapon_share" }

[[rule]]
granted_by = "weapon_perk:Voltshot"
sources = ["compendium:Weapon Perks/Voltshot"]
on = { event = "kill", source = "weapon" }
effect = { apply = "jolt" }
chance = { var = "policy.perk_weapon_share" }
note = "Reloading after a kill jolts the next hit's target."

[[rule]]
granted_by = "weapon_perk:Jolting Feedback"
sources = ["compendium:Weapon Perks/Jolting Feedback"]
on = { event = "kill", source = "weapon" }
effect = { apply = "jolt" }
chance = { var = "policy.perk_weapon_share" }
