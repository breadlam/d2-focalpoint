# Arc (docs/sandbox.md). Jolt's chains and Bolt Charge's discharges are
# core verbs; Ionic Traces' energy comes from their parameters.

# ------------------------------------------------------------- fragments

[[rule]]
granted_by = "fragment:Spark of Shock"
sources = ["compendium:Arc/Fragments/Spark of Shock"]
on = { event = "hit", source = "grenade", element = "arc" }
effect = { apply = "jolt" }

[[counter]]
name = "discharge_progress"
threshold = 1
note = "Spark of Discharge: Arc weapon kills towards an Ionic Trace."

[[rule]]
granted_by = "fragment:Spark of Discharge"
sources = ["compendium:Arc/Fragments/Spark of Discharge"]
on = { event = "kill", source = "weapon", element = "arc" }
effect = { progress = "discharge_progress", amount = { by_rank = { minor = 0.34, elite = 0.67 } } }

[[rule]]
granted_by = "fragment:Spark of Discharge"
sources = ["compendium:Arc/Fragments/Spark of Discharge"]
on = { event = "counter_full", counter = "discharge_progress" }
effect = [{ spawn = "ionic_trace", count = 1 }, { consume = "discharge_progress" }]

[[rule]]
granted_by = "fragment:Spark of Discharge"
sources = ["compendium:Arc/Fragments/Spark of Discharge"]
on = { event = "pickup", object = "ionic_trace" }
effect = { apply = "bolt_charge", stacks = 1, target = "self" }

[[rule]]
granted_by = "fragment:Spark of Ions"
sources = ["compendium:Arc/Fragments/Spark of Ions"]
on = { event = "kill", target_has = "jolt" }
effect = { spawn = "ionic_trace", count = 1 }
cooldown = 10

[[rule]]
granted_by = "fragment:Spark of Amplitude"
sources = ["compendium:Arc/Fragments/Spark of Amplitude"]
on = "kill"
when = [{ has = "amplified" }]
effect = { spawn = "orb_of_power", count = 1 }
chance = 0.5
cooldown = 10
confidence = "assumed"
note = "Two kills within 4 s while Amplified make an Orb, 10 s cooldown: one kill in two taken as the second."

[[rule]]
granted_by = "fragment:Spark of Beacons"
sources = ["compendium:Arc/Fragments/Spark of Beacons"]
on = { event = "kill", source = "weapon", element = "arc" }
when = [{ has = "amplified" }]
effect = { apply = "blind", target = "area", radius = 6 }
note = "Special and heavy Arc weapon kills only; the ammo split is not modelled."

[[rule]]
granted_by = "fragment:Spark of Brilliance"
sources = ["compendium:Arc/Fragments/Spark of Brilliance"]
on = { event = "kill", precision = true, target_has = "blind" }
effect = { apply = "blind", target = "area", radius = 6 }

[[rule]]
granted_by = "fragment:Spark of Recharge"
sources = ["compendium:Arc/Fragments/Spark of Recharge"]
on = "damage_taken"
when = [{ health_below = 0.3 }]
effect = [
  { regen = "grenade", amount = 4.0, duration = { var = "spark_of_recharge.duration" } },
  { regen = "melee", amount = 4.0, duration = { var = "spark_of_recharge.duration" } },
]

[[rule]]
granted_by = "fragment:Spark of Volts"
sources = ["compendium:Arc/Fragments/Spark of Volts"]
on = "finisher"
effect = [{ apply = "amplified", target = "self" }, { apply = "bolt_charge", stacks = 1, target = "self" }]

[[modifier]]
granted_by = "fragment:Spark of Focus"
sources = ["compendium:Arc/Fragments/Spark of Focus"]
param = "class.regen"
add = 1.5
when = [{ movement = "sprint" }]
note = "+150% class ability regeneration while sprinting, until a charge is ready."

[[rule]]
granted_by = "fragment:Spark of Instinct"
sources = ["compendium:Arc/Fragments/Spark of Instinct"]
on = "damage_taken"
when = [{ health_below = 0.3 }]
effect = [
  { damage = 46, target = "area", radius = 8, element = "arc", source = "ability" },
  { apply = "jolt", target = "area", radius = 8 },
]
cooldown = 15

[[rule]]
granted_by = "fragment:Spark of Momentum"
sources = ["compendium:Arc/Fragments/Spark of Momentum"]
on = { event = "pickup", object = "orb_of_power" }
effect = { apply = "bolt_charge", stacks = 3, target = "self" }
confidence = "assumed"
note = "Sliding over ammo bricks grants x3 Bolt Charge; ammo bricks are not modelled, so Orb pickups stand in for them."

