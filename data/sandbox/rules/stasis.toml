# Stasis (docs/sandbox.md).

# Howl of the Storm.

[[modifier]]
granted_by = "aspect:Howl of the Storm"
sources = ["compendium:Stasis/Aspect/Howl of the Storm", "clarity:1563930741"]
param = "melee.charges"
add = 1

# The sliding uppercut: 146 melee damage, freezes nearby enemies, and two
# lines of crystals (2 small, 4 medium, 2 large) whose shatters deal 158
# powered Stasis melee damage, down to 45% over 8 m.
[[rule]]
granted_by = "aspect:Howl of the Storm"
sources = ["compendium:Stasis/Aspect/Howl of the Storm", "clarity:1563930741"]
on = { event = "cast", ability = "melee" }
when = [{ movement = "slide" }]
effect = [
  { damage = 146, element = "stasis", source = "melee", tags = ["melee", "powered_melee"] },
  { apply = "frozen", target = "area" },
  { spawn = "stasis_crystal", sizes = { small = 2, medium = 4, large = 2 }, source = "melee", tags = ["powered_melee", "crystal"], falloff = 0.45 },
]
note = "The freeze radius is not stated."

[[modifier]]
granted_by = "aspect:Howl of the Storm"
sources = ["compendium:Stasis/Aspect/Howl of the Storm", "clarity:1563930741"]
damage = "powered_melee"
element = "stasis"
mul = 1.5
when = [{ target_has = "frozen" }, { target_rank_not = ["boss"] }]
note = "Howl's own damage against frozen non-boss enemies."

# Tectonic Harvest.

[[counter]]
name = "harvest_shatter"
threshold = 1
note = "Tectonic Harvest: Kinetic and Stasis weapon kills while Frost Armor is active progress it; more stacks, more progress."

[[rule]]
granted_by = "aspect:Tectonic Harvest"
sources = ["compendium:Stasis/Aspect/Tectonic Harvest", "clarity:2031919264"]
on = { event = "pickup", object = "stasis_shard", size = "small" }
effect = [{ heal = 10 }, { apply = "frost_armor", stacks = 1, target = "self" }]

[[rule]]
granted_by = "aspect:Tectonic Harvest"
sources = ["compendium:Stasis/Aspect/Tectonic Harvest", "clarity:2031919264"]
on = { event = "pickup", object = "stasis_shard", size = "large" }
effect = [{ heal = 20 }, { apply = "frost_armor", stacks = 3, target = "self" }]
note = "The Compendium leaves the large shard's healing unknown; Clarity gives 20 HP."

[[rule]]
granted_by = "aspect:Tectonic Harvest"
sources = ["compendium:Stasis/Aspect/Tectonic Harvest", "clarity:2031919264"]
on = { event = "kill", source = "weapon" }
when = [{ has = "frost_armor" }]
effect = { progress = "harvest_shatter", amount = 0.2 }
confidence = "assumed"
note = "Kinetic and Stasis weapon kills only; the progress per kill (rising with Frost Armor stacks) is not documented."

[[rule]]
granted_by = "aspect:Tectonic Harvest"
sources = ["compendium:Stasis/Aspect/Tectonic Harvest", "clarity:2031919264"]
on = { event = "counter_full", counter = "harvest_shatter" }
effect = [{ emit = "shatter", attributes = { of = "enemy" } }, { consume = "harvest_shatter" }]

[[gap]]
part = "aspect:Tectonic Harvest"
note = "Taking damage while Frost Armor is active grants melee energy, at most once a second; no source gives the amount."
sources = ["compendium:Stasis/Aspect/Tectonic Harvest", "clarity:2031919264"]

# Whisper of Hunger: the sources disagree. The Compendium has +60%, additive
# with other increases (10% -> 16%, 50% -> 80%); Clarity has 10% -> 17.5%
# and 50% -> 75%. The Compendium's is used.

[[modifier]]
granted_by = "fragment:Whisper of Hunger"
sources = ["compendium:Stasis/Fragments/Hunger", "clarity:2483898431"]
param = "stasis_shard.melee_energy_small"
mul = 1.6
note = "The Compendium's +60%; Clarity disagrees (10% -> 17.5%)."

[[modifier]]
granted_by = "fragment:Whisper of Hunger"
sources = ["compendium:Stasis/Fragments/Hunger", "clarity:2483898431"]
param = "stasis_shard.melee_energy_large"
mul = 1.6
note = "The Compendium's +60%; Clarity disagrees (50% -> 75%)."

# Whisper of Conduction.

[[modifier]]
