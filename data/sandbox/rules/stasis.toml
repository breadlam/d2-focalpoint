# Glacial Quake.

[[modifier]]
granted_by = "super:Glacial Quake"
sources = ["compendium:Stasis/Super Abilities/Glacial Quake"]
param = "super.duration"
set = 25

[[modifier]]
granted_by = "super:Glacial Quake"
sources = ["compendium:Stasis/Super Abilities/Glacial Quake"]
param = "super.damage_resist"
set = 0.90

[[rule]]
granted_by = "super:Glacial Quake"
sources = ["compendium:Stasis/Super Abilities/Glacial Quake"]
on = { event = "cast", ability = "super" }
effect = { apply = "frozen", target = "area", radius = 8 }

[[rule]]
granted_by = "super:Glacial Quake"
sources = ["compendium:Stasis/Super Abilities/Glacial Quake"]
on = "kill"
when = [{ in_super = true }]
effect = { spawn = "orb_of_power", count = 1 }
limit = 7
note = "Each of these Orbs grants 7.15% ability energy."

[[rule]]
granted_by = "super:Glacial Quake"
sources = ["compendium:Stasis/Super Abilities/Glacial Quake"]
on = "super_end"
effect = { charges = "melee", count = 3 }

[[modifier]]
granted_by = "super:Glacial Quake"
sources = ["compendium:Stasis/Super Abilities/Glacial Quake"]
damage = "any"
element = "stasis"
mul = 4.1
when = [{ in_super = true }, { target_has = "frozen" }]
note = "All Stasis damage against frozen enemies (light attacks and contact damage aside) is +310% and counts as super damage."

[[gap]]
part = "super:Glacial Quake"
note = "Contact damage (300 every 0.15 s to frozen enemies and crystals), the light and heavy attacks, and Glacial Howl (15% super energy per uppercut)."
sources = ["compendium:Stasis/Super Abilities/Glacial Quake"]
