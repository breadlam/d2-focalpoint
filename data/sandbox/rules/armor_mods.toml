  { energy = "grenade", amount = 0.04 },
  { energy = "melee", amount = 0.04 },
  { energy = "class", amount = 0.04 },
  { energy = "super", amount = 0.02 },
]
note = "x1.2 for Titans and x2 for Warlocks; the class is not modelled, x1 taken."

[[rule]]
granted_by = "armor_mod:Dynamo"
sources = ["compendium:Armor Mods/Dynamo"]
on = { event = "cast", ability = "class" }
when = [{ enemies_within = 15, min = 1 }]
effect = { energy = "super", amount = 0.025 }

[[rule]]
granted_by = "armor_mod:Hands-On"
sources = ["compendium:Armor Mods/Hands-On"]
on = { event = "kill", source = "melee", powered = true }
effect = { energy = "super", amount = { by_tier = [0.01, 0.01, 0.03, 0.05] } }

