on = { event = "hit", source = "melee", powered = true }
effect = { energy = "grenade", amount = 0.12 }
cooldown = 6

[[rule]]
granted_by = "armor_mod:Bolstering Detonation"
sources = ["compendium:Armor Mods/Bolstering Detonation", "cooldowns:Flat Gain Sources/Bolstering Detonation"]
on = { event = "hit", source = "grenade" }
effect = { energy = "class", amount = 0.12 }
cooldown = 6

[[rule]]
granted_by = "armor_mod:Focusing Strike"
sources = ["compendium:Armor Mods/Focusing Strike", "cooldowns:Flat Gain Sources/Focusing Strike"]
on = { event = "hit", source = "melee", powered = true }
effect = { energy = "class", amount = 0.12 }
cooldown = 6

[[rule]]
granted_by = "armor_mod:Momentum Transfer"
sources = ["compendium:Armor Mods/Momentum Transfer", "cooldowns:Flat Gain Sources/Momentum Transfer"]
on = { event = "hit", source = "grenade" }
effect = { energy = "melee", amount = 0.12 }
cooldown = 6

[[rule]]
granted_by = "armor_mod:Bomber"
sources = ["compendium:Armor Mods/Bomber", "cooldowns:Flat Gain Sources/Bomber"]
on = { event = "cast", ability = "class" }
effect = { energy = "grenade", amount = 0.12 }

[[rule]]
granted_by = "armor_mod:Outreach"
sources = ["compendium:Armor Mods/Outreach", "cooldowns:Flat Gain Sources/Outreach"]
on = { event = "cast", ability = "class" }
