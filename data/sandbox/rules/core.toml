# The sandbox's own verbs, written as records (docs/sandbox.md): granted by
# `core:` parts, which every build has. What needs code (ignition bursts,
# Jolt chains, Volatile explosions, crystals and shards) is in the engine.

[[rule]]
granted_by = "core:Devour"
sources = ["compendium:Void/Glossary/Devour"]
on = "kill"
when = [{ has = "devour" }]
effect = [
  { heal = 70 },
  { energy = "grenade", amount = { by_tier = [0.075, 0.116, 0.1375, 0.2] } },
  { extend = "devour", duration = 5 },
]
note = "Kills while Devour is active heal 70 HP, grant grenade energy by tier and refresh Devour."

[[modifier]]
granted_by = "core:Weaken"
sources = ["compendium:Void/Glossary/Weaken", "court:Global Debuffs/Weaken"]
damage = "any"
mul = 1.15
category = "global_debuff"
when = [{ target_has = "weaken" }]

[[modifier]]
granted_by = "core:Frozen"
sources = ["compendium:Stasis/Glossary/Freeze"]
damage = "melee"
mul = 2.2
when = [{ target_has = "frozen" }]
note = "Frozen enemies take 120% more melee damage."

# Orbs from abilities (large) grant 2.5-7% super energy; armor mods make
# small ones (0.8-1.5%). Every Orb grants Armor Charge.
[[rule]]
granted_by = "core:Orb of Power"
sources = ["compendium:Game Mechanics/Orbs of Power"]
on = { event = "pickup", object = "orb_of_power", size = "large" }
effect = { energy = "super", amount = { var = "orb_of_power.super_energy" } }

[[rule]]
granted_by = "core:Orb of Power"
sources = ["compendium:Armor Mods/Firepower", "compendium:Armor Mods/Reaper"]
on = { event = "pickup", object = "orb_of_power", size = "small" }
effect = { energy = "super", amount = 0.0125 }
note = "0.8% | 1.1% | 1.25% | 1.5% with 1-4 mods: 1.25% taken."

[[rule]]
granted_by = "core:Armor Charge"
sources = ["compendium:Armor Mods/Time Dilation"]
on = { event = "pickup", object = "orb_of_power" }
effect = { apply = "armor_charge", stacks = 1, target = "self" }
