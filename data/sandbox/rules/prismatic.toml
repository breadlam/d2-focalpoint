# Prismatic and the class abilities (docs/sandbox.md).

# ---------------------------------------------------------- Transcendence

# Kills fill the Light and Darkness bars; full, Transcendence grants its buff
# and a Prismatic grenade.
[[counter]]
name = "transcendence_progress"
threshold = 1
note = "Transcendence's two bars, filled by damage and elemental effects: kills stand in for them."

[[rule]]
granted_by = "transcendence:Transcendence"
sources = ["compendium:Prismatic/Glossary/Transcendence"]
on = "kill"
effect = { progress = "transcendence_progress", amount = { var = "transcendence.progress_per_kill" } }

[[rule]]
granted_by = "transcendence:Transcendence"
sources = ["compendium:Prismatic/Glossary/Transcendence"]
on = { event = "counter_full", counter = "transcendence_progress" }
effect = [
  { emit = "transcendence" },
  { consume = "transcendence_progress" },
  { apply = "transcendence_buff", target = "self" },
]

[[rule]]
granted_by = "transcendence:Hailfire Spike"
sources = ["compendium:Prismatic/Hunter/Hailfire Spike"]
on = "transcendence"
effect = [
  { damage = 78, target = "area", radius = 5, element = "stasis", source = "grenade", tags = ["grenade"] },
  { damage = 15.6, times = 14, target = "area", radius = 5, element = "stasis", source = "grenade", tags = ["grenade"] },
  { apply = "slow", stacks = 13, times = 14, target = "area", radius = 5 },
  { damage = 39, times = 8, target = "area", radius = 5, element = "solar", source = "grenade", tags = ["grenade"] },
  { apply = "scorch", stacks = 10, times = 8, target = "area", radius = 5 },
]
confidence = "assumed"
note = "A slowing storm for 3.45 s, then a scorching cyclone; the cone's reach and the cyclone's ticks are not stated."

[[rule]]
granted_by = "transcendence:Freezing Singularity"
sources = ["compendium:Prismatic/Warlocks/Freezing Singularity"]
on = "transcendence"
effect = [
  { damage = 70, target = "area", radius = 6, element = "void", source = "grenade", tags = ["grenade"] },
  { damage = 18, times = 14, target = "area", radius = 6, element = "stasis", source = "grenade", tags = ["grenade"] },
  { apply = "slow", stacks = 13, times = 14, target = "area", radius = 6 },
  { apply = "suppression", target = "area", radius = 6 },
]

[[rule]]
granted_by = "transcendence:Electrified Snare"
sources = ["compendium:Prismatic/Titan/Electrified Snare"]
on = "transcendence"
effect = [
  { damage = 105, target = "area", radius = { var = "electrified_snare.radius" }, element = "arc", source = "grenade", tags = ["grenade"] },
  { apply = "suspend", target = "area", radius = { var = "electrified_snare.radius" } },
  { apply = "jolt", target = "area", radius = { var = "electrified_snare.radius" } },
]
note = "The suspended enemies' damage ticks are not stated."

