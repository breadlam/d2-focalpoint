low = 1.0
high = 6.0
unit = "count"
status = "guess"
basis = "A Jolted enemy chains each time it is damaged again, at most every 0.8 s for 10 s; most Jolted enemies take a few more hits before they die."
measure = "From recordings: chain lightning bursts per Jolted enemy."

[[variable]]
