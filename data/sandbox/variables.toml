[[variable]]
name = "scenario.pack_size"
guess = 8.0
low = 3.0
high = 15.0
unit = "count"
status = "guess"
basis = "Ad packs in strikes, Conquests and dungeons are commonly five to twelve enemies; to be calibrated on the recorded clears."
measure = "Count the enemies of typical packs in recordings of each activity."

[[variable]]
name = "scenario.pack_radius"
guess = 10.0
low = 6.0
high = 20.0
unit = "m"
status = "guess"
basis = "Packs spread over a room or a corridor's width; most fall within 15-20 m across."
measure = "Estimate pack spread in recordings against known distances (doorways, the Shooting Range markers)."

[[variable]]
name = "scenario.packs_per_minute"
guess = 1.5
low = 0.5
high = 4.0
unit = "count"
status = "guess"
basis = "Ad-clear content brings a new pack every 30-60 s of combat; dense content (Onslaught, Conquest waves) faster."
measure = "From the recorded clears: kills per minute over pack size, per activity (calibration); or count packs in recordings."

[[variable]]
name = "scenario.ability_efficiency"
guess = 0.07
low = 0.02
high = 1.0
unit = "fraction"
status = "estimate"
basis = "The share of area and verb damage that counts towards kills (single-target hits have `scenario.direct_hit_efficiency`): less overkill, falloff, damage on enemies that weapons finish, and the pack's uneven spread. It also absorbs what the model overstates, above all loops' cast rates. Fitted so the kits' mean share of kills by abilities matches their recorded mean (`focalpoint analyze model --fit`, 2026-11-22, with chip kills and enemy availability): 0.079 over 86 Grandmaster Conquest kits, 0.048 over 60 Ultimate Fireteam Op kits."
measure = "Fitted, not measured: the recorded kits' ability kill shares per context."

[[variable]]
name = "scenario.elite_share"
guess = 0.25
low = 0.1
high = 0.5
unit = "fraction"
status = "guess"
basis = "Packs are mostly minors with a few elites; harder content adds elites."
measure = "Count minors and elites in packs in recordings of each activity."

[[variable]]
name = "build.default_stat"
guess = 100.0
